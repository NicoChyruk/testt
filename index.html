<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Day 34 - Next Gen Stats</title>
    <style>
        :root {
            --accent-blue: #00d2ff;
            --accent-green: #34c759;
            --accent-orange: #ff9500;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white; overflow: hidden;
            /* Animated Background */
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #000000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .status-bar {
            position: relative; z-index: 10; text-align: right;
            padding: 45px 20px 5px 0; color: #34c759; font-size: 14px; font-weight: bold;
        }

        .marquee {
            position: relative; z-index: 10; background: rgba(0,0,0,0.3);
            backdrop-filter: blur(5px); padding: 12px 0; overflow: hidden; 
            border-bottom: 1px solid var(--glass); text-transform: uppercase; letter-spacing: 1px;
        }
        
        .marquee-inner {
            display: inline-block; white-space: nowrap;
            animation: scroll 20s linear infinite; font-size: 11px; font-weight: 700;
        }
        
        @keyframes scroll { 
            0% { transform: translateX(100%); } 
            100% { transform: translateX(-100%); } 
        }

        .container { position: relative; z-index: 2; width: 90%; margin: 20px auto; display: flex; flex-direction: column; gap: 15px; }

        /* THE GLASS CARD */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .stat-label { font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.5); margin-bottom: 5px; }
        .stat-value { font-size: 32px; font-weight: 900; margin-bottom: 10px; }

        /* PROGRESS BARS */
        .progress-wrapper { margin-top: 15px; }
        .progress-container {
            width: 100%; background: rgba(255,255,255,0.1); height: 8px; 
            border-radius: 10px; overflow: hidden;
        }
        .progress-fill {
            width: 0%; height: 100%; background: var(--accent-blue);
            box-shadow: 0 0 10px var(--accent-blue);
            animation: load 2s ease-out forwards 1s;
        }
        .fill-green { background: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .fill-orange { background: var(--accent-orange); box-shadow: 0 0 10px var(--accent-orange); }

        @keyframes load { from { width: 0; } to { width: 0.5%; } } /* adjusted to look visible */

        /* MESSAGES */
        .bubble {
            padding: 12px 18px; border-radius: 20px; font-size: 16px;
            max-width: 75%; line-height: 1.4;
        }
        .blue {
            background: #007aff; align-self: flex-end; 
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,122,255,0.3);
            opacity: 0; animation: fadeIn 0.5s forwards 3s;
        }

        .dog-image {
            align-self: flex-start; width: 180px; border-radius: 20px;
            border: 2px solid var(--glass);
            opacity: 0; animation: fadeIn 0.5s forwards 4s;
        }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>
    <div class="status-bar">99% ⚡</div>
    
    <div class="marquee">
        <div class="marquee-inner">
            DAY 34 • THE GRIND NEVER STOPS • ACCIDENTALLY RICH SOON • MEMBER #72 IS A LEGEND • JOIN THE SQUAD • 
        </div>
    </div>

    <div class="container">
        <div class="glass-card">
            <div class="stat-label">TOTAL LIKES EARNINGS (1¢ = 1 LIKE)</div>
            <div id="counter" class="stat-value">$0.00</div>
            
            <div class="progress-container">
                <div class="progress-fill"></div>
            </div>
            <div style="display:flex; justify-content: space-between; font-size: 10px; margin-top: 5px; opacity: 0.6;">
                <span>$0</span><span>GOAL: $1,000,000</span>
            </div>

            <div class="progress-wrapper">
                <div class="stat-label" style="color: var(--accent-green);">YOUTUBE ADS</div>
                <div id="yt-ads" style="font-size: 18px; font-weight: 700;">$0.00</div>
                <div class="progress-container" style="height: 4px; margin-top: 5px;">
                    <div class="progress-fill fill-green" style="width: 0%;"></div>
                </div>
            </div>

            <div class="progress-wrapper">
                <div class="stat-label" style="color: var(--accent-orange);">COMMUNITY TIPS</div>
                <div id="tips" style="font-size: 18px; font-weight: 700;">$0.00</div>
                <div class="progress-container" style="height: 4px; margin-top: 5px;">
                    <div class="progress-fill fill-orange" style="width: 0%;"></div>
                </div>
            </div>
        </div>

        <div class="bubble blue">
            Be the reason I wake up happy tomorrow. <br>
            <strong>Follow for Day 35. 🔓</strong>
        </div>

        <img class="dog-image" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExcTZmdDB3ODlpMXE5cmxwZHk3a2R4YzRkYzZwMmR5ZGI1dGE0bGFqOSZlcD12MV9naWZzX3NlYXJjaCZjdD1n/ar71Hyi0ZKejXzMoNs/giphy.gif" alt="Funny Dog">
    </div>

    <script>
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                obj.innerHTML = "$" + (progress * (end - start) + start).toFixed(2);
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        const objLikes = document.getElementById("counter");
        setTimeout(() => {
            animateValue(objLikes, 0, 6.38, 2000);
        }, 1000);
    </script>
</body>
</html>
